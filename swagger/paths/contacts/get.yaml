tags:
  - Contacts
summary: Get all contacts
operationId: getContacts
description: Retrieve a list of contacts with optional pagination
security:
  - bearerAuth: []
parameters:
  - name: limit
    in: query
    schema:
      type: integer
      default: 10
    description: Maximum number of contacts to return
  - name: offset
    in: query
    schema:
      type: integer
      default: 0
    description: Number of contacts to skip
responses:
  '200':
    description: List of contacts
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '../../components/schemas/contact.yaml'
