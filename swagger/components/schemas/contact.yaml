type: object
properties:
  _id:
    type: string
    example: '68c6c93b96ee64fb7aac8b9a'
  name:
    type: string
    example: 'User Name'
  phoneNumber:
    type: string
    example: '+381234567'
  email:
    type: string
    example: 'user@example.com'
  isFavourite:
    type: boolean
    example: false
  contactType:
    type: string
    enum: [work, home, personal]
    example: work
  userId:
    type: string
    example: '68c6c88296ee64fb7aac8b82'
  photo:
    type: string
    example: 'https://res.cloudinary.com/demo/image/upload/v12345/contacts/photo.png'
  createdAt:
    type: string
    format: date-time
  updatedAt:
    type: string
    format: date-time
  __v:
    type: integer
    example: 0
required:
  - _id
  - name
  - phoneNumber
  - userId
