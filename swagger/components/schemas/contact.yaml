type: object
properties:
  _id:
    type: string
    example: '64f1c2a1b5d4e8a9f0b12345'
  name:
    type: string
    example: 'User Name'
  phoneNumber:
    type: string
    example: '+380671234567'
  isFavourite:
    type: boolean
    example: false
  contactType:
    type: string
    example: 'work'
  userId:
    type: string
    example: '64f1c2a1b5d4e8a9f0b67890'
  photo:
    type: string
    example: 'https://res.cloudinary.com/ddbvyhgxn/image/upload/v1757858117/contacts/photo.png'
  createdAt:
    type: string
    format: date-time
  updatedAt:
    type: string
    format: date-time
required:
  - _id
  - name
  - phoneNumber
  - userId
